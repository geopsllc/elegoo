# Centauri Monitor — Apache vhost with printer proxy.
# Requires: mod_ssl, mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_headers
#   (Debian/Ubuntu: a2enmod ssl proxy proxy_http proxy_wstunnel headers)
#
# Replace: printer.example.com, the cert paths, the repo path, and 192.168.1.50 (printer IP).

<VirtualHost *:80>
    ServerName printer.example.com
    Redirect permanent / https://printer.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName printer.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/printer.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/printer.example.com/privkey.pem

    DocumentRoot /var/www/html/elegoo

    # IMPORTANT: the proxied WebSocket accepts every SDCP command, including
    # starting/stopping prints. The dashboard only reads, but anyone who can
    # reach this URL could send commands. Keep authentication on.
    <Location "/">
        AuthType Basic
        AuthName "Printer"
        AuthUserFile /var/www/html/elegoo/.htpasswd
        Require valid-user
    </Location>

    <Directory /var/www/html/elegoo>
        Options -Indexes
        AllowOverride None
    </Directory>
    # Must come after <Location "/">: blocks .htpasswd, .git, dev/ and deploy/.
    <LocationMatch "(^|/)\.(ht|git)|^/(dev|deploy)(/|$)">
        Require all denied
    </LocationMatch>

    # Printer proxy — status WebSocket and MJPEG camera.
    ProxyRequests Off
    ProxyTimeout 3600
    <Location "/printer/ws">
        # The printer expects requests from its own web UI.
        RequestHeader unset Origin
        ProxyPass        ws://192.168.1.50:3030/websocket
    </Location>
    <Location "/printer/video">
        ProxyPass        http://192.168.1.50:3031/video flushpackets=on
        ProxyPassReverse http://192.168.1.50:3031/video
        Header set Cache-Control "no-store"
    </Location>
</VirtualHost>
