<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centauri Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231c1f24'/><path d='M9 22h14M11 22V12l5-3 5 3v10' stroke='%237dd3fc' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <header class="bar-top">
      <div class="cell status">
        <div class="eyebrow" id="machineName">Centauri Carbon</div>
        <div class="state" id="state"><span class="dot"></span><span id="stateText">Connecting…</span></div>
      </div>

      <div class="cell job">
        <div class="job-line">
          <span class="filename" id="filename">—</span>
          <span class="pct"><span id="pct">0</span>%</span>
        </div>
        <div class="bar"><div class="fill" id="bar"></div></div>
      </div>

      <div class="group">
        <div class="cell stat"><span class="k">Remaining</span><span class="v" id="remaining">—</span></div>
        <div class="cell stat"><span class="k">Finishes</span><span class="v" id="finish">—</span></div>
        <div class="cell stat"><span class="k">Layer</span><span class="v" id="layer">—</span></div>
        <div class="cell stat hide-md"><span class="k">Elapsed</span><span class="v" id="elapsed">—</span></div>
        <div class="cell stat hide-lg"><span class="k">Speed</span><span class="v" id="speed">—</span></div>
      </div>

      <div class="group temps">
        <div class="cell temp" data-key="nozzle">
          <span class="k">Nozzle</span>
          <span class="t-val"><span class="cur">—</span><span class="tgt"></span></span>
          <span class="t-bar"><span></span></span>
        </div>
        <div class="cell temp" data-key="bed">
          <span class="k">Bed</span>
          <span class="t-val"><span class="cur">—</span><span class="tgt"></span></span>
          <span class="t-bar"><span></span></span>
        </div>
        <div class="cell temp" data-key="box">
          <span class="k">Chamber</span>
          <span class="t-val"><span class="cur">—</span><span class="tgt"></span></span>
          <span class="t-bar"><span></span></span>
        </div>
      </div>

      <div class="group fans hide-lg" title="Fan speeds">
        <div class="cell stat"><span class="k">Part fan</span><span class="v" id="fanModel">—</span></div>
        <div class="cell stat"><span class="k">Aux</span><span class="v" id="fanAux">—</span></div>
        <div class="cell stat"><span class="k">Chamber fan</span><span class="v" id="fanBox">—</span></div>
      </div>

      <button class="icon-btn" id="settingsBtn" title="Printer address" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <section class="camera" id="camera">
      <img id="feed" alt="Printer camera feed">
      <div class="camera-msg" id="camMsg">Connecting to camera…</div>
      <div class="camera-overlay">
        <span class="live" id="liveBadge"><i></i>LIVE</span>
        <span class="clock" id="clock"></span>
      </div>
      <div class="foot" id="foot">Not connected</div>
      <div class="cam-btns">
        <button class="icon-btn" id="fitBtn" title="Fill / fit video (Z)" aria-label="Toggle fill or fit">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 12h8M8 12l2-2M8 12l2 2M16 12l-2-2M16 12l-2 2"/></svg>
        </button>
        <button class="icon-btn" id="fsBtn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </section>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <h2>Printer address</h2>
      <p>IP or hostname of your Centauri Carbon on the local network.</p>
      <input id="hostInput" placeholder="192.168.1.50" autocomplete="off" spellcheck="false" required>
      <div class="actions">
        <button value="cancel" formnovalidate class="ghost">Cancel</button>
        <button value="save" class="primary">Connect</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
